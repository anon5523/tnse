<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台南市雨水下水道 GIS 管線圖</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#080c14;--bg2:#111827;--bg3:#1a2236;--bdr:#1e293b;
  --txt:#e2e8f0;--t2:#94a3b8;--t3:#64748b;
  --cy:#22d3ee;--bl:#3b82f6;--gn:#10b981;--or:#f59e0b;--rd:#ef4444;--pu:#a855f7;
  --f:'Noto Sans TC',sans-serif;--m:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:var(--f);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── Header ── */
.hdr{background:linear-gradient(135deg,#0f172a,#1e293b);border-bottom:1px solid var(--bdr);padding:.6rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0;z-index:1000;position:relative;min-width:0}
.hdr-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1;overflow:hidden}
.hdr-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--bl),var(--cy));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;box-shadow:0 0 10px rgba(34,211,238,.2);flex-shrink:0}
.hdr-text{min-width:0;overflow:hidden}
.hdr-title{font-size:1rem;font-weight:700;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sub{font-size:.62rem;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.hdr-clock{font-family:var(--m);font-size:.75rem;color:var(--cy);background:rgba(34,211,238,.07);padding:3px 8px;border-radius:5px;border:1px solid rgba(34,211,238,.13)}
.back-btn{padding:4px 12px;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);color:#93c5fd;border-radius:5px;font-size:.75rem;cursor:pointer;font-family:var(--f);text-decoration:none;display:flex;align-items:center;gap:5px;transition:.15s}
.back-btn:hover{background:rgba(59,130,246,.25)}
/* ── 定位按鈕 ── */
.loc-btn{width:34px;height:34px;background:var(--bg3);border:1.5px solid var(--bdr);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;flex-shrink:0;transition:.2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;position:relative}
.loc-btn:active{background:#1f2847}
.loc-btn.tracking{border-color:var(--cy);background:rgba(34,211,238,.12);animation:locPulse 2s ease-in-out infinite}
.loc-btn.tracking::after{content:'';position:absolute;inset:-3px;border-radius:10px;border:1.5px solid rgba(34,211,238,.4);animation:locRing 2s ease-in-out infinite}
@keyframes locPulse{0%,100%{box-shadow:0 0 0 0 rgba(34,211,238,.3)}50%{box-shadow:0 0 0 6px rgba(34,211,238,.0)}}
@keyframes locRing{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.3);opacity:0}}

/* ── Main layout ── */
.main{display:flex;flex:1;overflow:hidden;position:relative}

/* ── Side Panel ── */
.side{width:280px;background:var(--bg2);border-right:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:width .25s ease}
.side.collapsed{width:0}
.side-inner{width:280px;padding:14px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;height:100%}

.section-title{font-size:.72rem;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}

/* ── 底圖選擇 ── */
.basemap-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bm-btn{background:var(--bg3);border:1.5px solid var(--bdr);border-radius:7px;padding:7px 8px;cursor:pointer;font-family:var(--f);font-size:.73rem;color:var(--t2);text-align:center;transition:.15s;line-height:1.3}
.bm-btn:hover{border-color:var(--bl);color:var(--txt)}
.bm-btn.active{border-color:var(--cy);color:var(--cy);background:rgba(34,211,238,.08)}
.bm-icon{font-size:1.1rem;display:block;margin-bottom:3px}

/* ── 圖層開關 ── */
.layer-item{display:flex;align-items:center;gap:10px;padding:9px 10px;background:var(--bg3);border:1px solid var(--bdr);border-radius:8px;cursor:pointer;transition:.15s;user-select:none}
.layer-item:hover{background:#1f2847}
.layer-item.active{border-color:var(--color)}
.layer-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;transition:.15s}
.layer-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--bdr);background:var(--bg2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.65rem;transition:.15s}
.layer-check.on{background:var(--color);border-color:var(--color);color:#fff}
.layer-label{flex:1;font-size:.8rem;font-weight:500}
.layer-count{font-family:var(--m);font-size:.68rem;color:var(--t3);background:rgba(255,255,255,.05);padding:2px 6px;border-radius:10px}

/* ── 顯示選項 ── */
.opt-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0}
.opt-label{font-size:.78rem;color:var(--t2)}
.toggle{width:36px;height:20px;background:var(--bdr);border-radius:10px;position:relative;cursor:pointer;transition:.2s;flex-shrink:0}
.toggle.on{background:var(--cy)}
.toggle::after{content:'';position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s}
.toggle.on::after{left:19px}

/* ── 狀態列 ── */
.status-bar{padding:8px 10px;background:var(--bg3);border:1px solid var(--bdr);border-radius:7px;font-size:.72rem;color:var(--t3);line-height:1.6}
.status-item{display:flex;justify-content:space-between;gap:8px}
.status-val{font-family:var(--m);color:var(--t2);font-weight:600}
.status-val.loading{color:var(--cy);animation:blink 1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.status-val.done{color:var(--gn)}
.status-val.err{color:var(--rd)}

/* ── 圖例 ── */
.legend-item{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--t2);padding:3px 0}
.leg-line{width:22px;height:3px;border-radius:2px;flex-shrink:0}
.leg-circle{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ── 折疊按鈕 ── */
.toggle-panel{position:absolute;left:280px;top:50%;transform:translateY(-50%);z-index:500;background:var(--bg3);border:1px solid var(--bdr);border-left:0;border-radius:0 6px 6px 0;padding:8px 4px;cursor:pointer;color:var(--t2);font-size:.75rem;transition:.25s;writing-mode:vertical-lr}
.toggle-panel:hover{color:var(--cy);background:#1f2847}
.side.collapsed~.toggle-panel{left:0;border-left:1px solid var(--bdr)}

/* ── 地圖 ── */
#map{flex:1;z-index:1}

/* ── Popup ── */
.pop-wrap{font-family:'Noto Sans TC',Arial,sans-serif;font-size:12px;min-width:200px;max-width:280px;line-height:1.65}
.pop-title{font-weight:700;font-size:13px;color:#1e293b;border-bottom:2px solid #3b82f6;padding-bottom:5px;margin-bottom:8px}
.pop-title.pipe{border-color:#3b82f6}
.pop-title.manhole{border-color:#10b981}
.pop-row{display:flex;gap:6px;margin-bottom:3px}
.pop-key{color:#64748b;white-space:nowrap;font-size:11px;min-width:60px}
.pop-val{color:#1e293b;font-size:11px;font-family:monospace}
.pop-badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:600;margin-top:4px}

/* ── Loader overlay ── */
.loader{position:absolute;inset:0;background:rgba(8,12,20,.85);z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s}
.loader.hide{opacity:0;pointer-events:none}
.spinner{width:38px;height:38px;border:3px solid var(--bdr);border-top-color:var(--cy);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-txt{color:var(--t2);font-size:.85rem;text-align:center}
.loader-prog{font-family:var(--m);font-size:.75rem;color:var(--cy)}

/* ── 搜尋框 ── */
.search-wrap{position:relative}
.search-input{width:100%;background:var(--bg3);border:1px solid var(--bdr);color:var(--txt);font-family:var(--f);font-size:.78rem;padding:7px 10px 7px 30px;border-radius:6px;outline:none;transition:.15s}
.search-input:focus{border-color:var(--bl)}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:.8rem;pointer-events:none}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--t3);cursor:pointer;font-size:.9rem;display:none}

/* ── 人孔標籤 ── */
.manhole-label{background:rgba(16,185,129,.85);color:#fff;font-size:9px;font-family:monospace;padding:1px 4px;border-radius:3px;white-space:nowrap;border:1px solid rgba(16,185,129,.4);box-shadow:0 1px 3px rgba(0,0,0,.3)}

/* ── 漢堡按鈕（手機用）── */
.hamburger-btn{display:none;align-items:center;justify-content:center;width:36px;height:36px;background:var(--bg3);border:1.5px solid var(--bdr);border-radius:8px;cursor:pointer;color:var(--t2);font-size:1.2rem;flex-shrink:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.hamburger-btn:active{background:#1f2847;color:var(--cy)}

@media(max-width:700px){
  .hamburger-btn{display:flex}
  .side{width:85%;max-width:300px;position:absolute;top:0;left:0;height:100%;z-index:600;transition:transform .25s ease,opacity .25s ease}
  .side.collapsed{width:85%;max-width:300px;transform:translateX(-100%);opacity:0;pointer-events:none}
  .toggle-panel{display:none}
  .map-overlay{display:none;position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:599;-webkit-tap-highlight-color:transparent}
  .map-overlay.show{display:block}
  /* 手機 header 精簡 */
  .hdr-clock{display:none}
  .back-btn{padding:3px 8px;font-size:.7rem}
  .hdr{padding:.5rem .75rem}
}
</style>
</head>
<body>

<!-- Header -->
<header class="hdr">
  <div class="hdr-left">
    <div class="hamburger-btn" id="hamburger-btn" onclick="toggleSide()" aria-label="開關側欄">≡</div>
    <div class="hdr-icon">🗺️</div>
    <div class="hdr-text">
      <div class="hdr-title">台南市雨水下水道 GIS 管線圖</div>
      <div class="hdr-sub">管線 &amp; 人孔圖資 ｜ 資料來源：台南市水利局</div>
    </div>
  </div>
  <div class="hdr-right">
    <a href="水位監測儀表板v4_3.html" class="back-btn">← 水位儀表板</a>
    <div class="hdr-clock" id="clock">--:--:--</div>
    <div class="loc-btn" id="loc-btn" onclick="toggleLocTracking()" title="連續定位追蹤">📍</div>
  </div>
</header>

<div class="main">
  <div class="map-overlay" id="map-overlay" onclick="closeSideOnMobile()"></div>
  <!-- Side Panel -->
  <div class="side" id="side">
    <div class="side-inner">

      <!-- 搜尋 -->
      <div>
        <div class="section-title">🔍 搜尋人孔編號</div>
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input class="search-input" id="search-input" type="text" placeholder="輸入人孔編號或地址…">
          <button class="search-clear" id="search-clear">✕</button>
        </div>
        <div id="search-result" style="font-size:.72rem;color:var(--t3);margin-top:5px;"></div>
      </div>

      <!-- 底圖選擇 -->
      <div>
        <div class="section-title">🗺️ 底圖選擇</div>
        <div class="basemap-grid">
          <button class="bm-btn active" id="bm-osm" onclick="setBasemap('osm')">
            <span class="bm-icon">🌍</span>OSM 街道圖
          </button>
          <button class="bm-btn" id="bm-nlsc" onclick="setBasemap('nlsc')">
            <span class="bm-icon">🇹🇼</span>通用電子地圖
          </button>
          <button class="bm-btn" id="bm-google" onclick="setBasemap('google')">
            <span class="bm-icon">🛰️</span>Google 衛星圖
          </button>
          <button class="bm-btn" id="bm-rumap" onclick="setBasemap('rumap')">
            <span class="bm-icon">📍</span>魯地圖
          </button>
        </div>
      </div>

      <!-- 圖層控制 -->
      <div>
        <div class="section-title">📂 圖層控制</div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <div class="layer-item active" id="layer-pipe" style="--color:#3b82f6" onclick="toggleLayer('pipe')">
            <div class="layer-dot" style="background:#3b82f6"></div>
            <div class="layer-check on" id="chk-pipe" style="--color:#3b82f6">✓</div>
            <div class="layer-label">雨水管線</div>
            <div class="layer-count" id="cnt-pipe">—</div>
          </div>
          <div class="layer-item active" id="layer-manhole" style="--color:#10b981" onclick="toggleLayer('manhole')">
            <div class="layer-dot" style="background:#10b981"></div>
            <div class="layer-check on" id="chk-manhole" style="--color:#10b981">✓</div>
            <div class="layer-label">雨水人孔</div>
            <div class="layer-count" id="cnt-manhole">—</div>
          </div>
          <div class="layer-item active" id="layer-divert-pipe" style="--color:#f97316" onclick="toggleLayer('divert-pipe')">
            <div class="layer-dot" style="background:#f97316"></div>
            <div class="layer-check on" id="chk-divert-pipe" style="--color:#f97316">✓</div>
            <div class="layer-label">截流管線</div>
            <div class="layer-count" id="cnt-divert-pipe">137</div>
          </div>
          <div class="layer-item active" id="layer-divert-mh" style="--color:#fb923c" onclick="toggleLayer('divert-mh')">
            <div class="layer-dot" style="background:#fb923c"></div>
            <div class="layer-check on" id="chk-divert-mh" style="--color:#fb923c">✓</div>
            <div class="layer-label">截流人孔</div>
            <div class="layer-count" id="cnt-divert-mh">142</div>
          </div>
        </div>
      </div>

      <!-- 顯示選項 -->
      <div>
        <div class="section-title">⚙️ 顯示選項</div>
        <div style="display:flex;flex-direction:column;gap:2px">
          <div class="opt-row">
            <span class="opt-label">顯示人孔編號</span>
            <div class="toggle on" id="tog-label" onclick="toggleManholeLabels()"></div>
          </div>
          <div class="opt-row">
            <span class="opt-label">點選時置中縮放</span>
            <div class="toggle on" id="tog-zoom" onclick="toggleZoomOnClick()"></div>
          </div>
          <div class="opt-row">
            <span class="opt-label">管線寬度</span>
            <select id="pipe-width" onchange="updatePipeWidth()" style="background:var(--bg3);border:1px solid var(--bdr);color:var(--txt);font-family:var(--f);font-size:.75rem;padding:3px 6px;border-radius:4px">
              <option value="1.5">細 (1.5px)</option>
              <option value="2.5" selected>中 (2.5px)</option>
              <option value="4">粗 (4px)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 載入狀態 -->
      <div>
        <div class="section-title">📡 資料載入狀態</div>
        <div class="status-bar">
          <div class="status-item"><span>管線圖資</span><span class="status-val loading" id="st-pipe">載入中…</span></div>
          <div class="status-item"><span>人孔圖資</span><span class="status-val loading" id="st-manhole">載入中…</span></div>
          <div class="status-item" style="margin-top:4px;border-top:1px solid var(--bdr);padding-top:4px"><span>資料筆數</span><span class="status-val" id="st-total">—</span></div>
        </div>
      </div>

      <!-- 圖例 -->
      <div>
        <div class="section-title">📌 圖例</div>
        <div class="legend-item"><div class="leg-line" style="background:#3b82f6"></div>雨水管線</div>
        <div class="legend-item"><div class="leg-circle" style="background:#10b981;border:1.5px solid #059669"></div>雨水人孔</div>
        <div class="legend-item"><div class="leg-line" style="background:#f97316"></div>截流管線</div>
        <div class="legend-item"><div class="leg-circle" style="background:#fb923c;border:1.5px solid #ea580c"></div>截流人孔</div>
        <div class="legend-item" style="margin-top:6px;font-size:.7rem;color:var(--t3);">點擊任何圖徵可查看詳細屬性</div>
      </div>

    </div>
  </div>

  <!-- 折疊按鈕 -->
  <div class="toggle-panel" id="toggle-panel" onclick="toggleSide()" title="展開/收合側欄">◀</div>

  <!-- 地圖 -->
  <div id="map"></div>

  <!-- 載入遮罩 -->
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div class="loader-txt">正在載入 GIS 圖資…</div>
    <div class="loader-prog" id="loader-prog">準備中</div>
  </div>
</div>

async function tryFetch(url, timeoutMs=60000) {
  const makeSignal = (ms) => {
    const ctrl = new AbortController();
    setTimeout(()=>ctrl.abort(), ms);
    return ctrl.signal;
  };
  if (IS_LOCAL_GIS) {
    const localUrl = url.replace(GIS_BASE_REMOTE, '/gisapi');
    console.log('[GIS] 本機請求:', localUrl);
    try {
      const r = await fetch(localUrl, { signal: makeSignal(timeoutMs) });
      if (r.ok) { const j = await r.json(); console.log('[GIS] 本機回應 OK'); return j; }
      console.warn('[GIS] 本機回應非 OK:', r.status);
    } catch(e) { console.warn('[GIS] 本機請求失敗:', e.message); }
    return null;
  }
  console.log('[GIS] 遠端請求:', url);
  const proxies = [
    () => fetch(url, { signal: makeSignal(timeoutMs) }),
    () => fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`, { signal: makeSignal(timeoutMs) }),
    () => fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`, { signal: makeSignal(timeoutMs) }),
  ];
  for (const p of proxies) {
    try {
      const r = await p();
      if (r.ok) { const txt = await r.text(); return JSON.parse(txt); }
    } catch(e) { console.warn('[GIS] proxy 失敗:', e.message); }
  }
  return null;
}

function gisUrl(path) { return GIS_BASE_REMOTE + path; }

async function fetchLayerInfo(layerId) {
  return await tryFetch(gisUrl(`/${layerId}?f=json`), 30000);
}

// ── GIS 載入模式 ──
let isBboxMode = false;
let lastLoadedBounds = null;
let bboxTimer = null;

async function fetchAllFeatures(layerId, onProgress) {
  const info   = await fetchLayerInfo(layerId);
  const maxRec = (info && info.maxRecordCount) ? Math.min(info.maxRecordCount, 2000) : 1000;

  const idsData = await tryFetch(gisUrl(`/${layerId}/query?where=1%3D1&returnIdsOnly=true&f=json`), 30000);
  if (!idsData || !idsData.objectIds) {
    const data = await tryFetch(gisUrl(`/${layerId}/query?where=1%3D1&outFields=*&outSR=4326&f=geojson`), 60000);
    return data ? data.features || [] : [];
  }

  const ids = idsData.objectIds;
  const total = ids.length;
  const features = [];
  for (let i = 0; i < total; i += maxRec) {
    const batchIds = ids.slice(i, i + maxRec).join(',');
    const data = await tryFetch(gisUrl(`/${layerId}/query?objectIds=${batchIds}&outFields=*&outSR=4326&f=geojson`), 60000);
    if (data && data.features) features.push(...data.features);
    if (onProgress) onProgress(features.length, total);
    await new Promise(r => setTimeout(r, 80));
  }
  return features;
}

// bbox 查詢：只抓目前視窗範圍
async function fetchByBounds(layerId, bounds, onProgress) {
  const sw = bounds.getSouthWest(), ne = bounds.getNorthEast();
  const latD = (ne.lat - sw.lat) * 0.4, lngD = (ne.lng - sw.lng) * 0.4;
  const env = `${sw.lng-lngD},${sw.lat-latD},${ne.lng+lngD},${ne.lat+latD}`;
  const url = gisUrl(`/${layerId}/query?where=1%3D1&geometry=${env}&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=*&outSR=4326&f=geojson`);
  const data = await tryFetch(url, 45000);
  const feats = data?.features || [];
  if (onProgress) onProgress(feats.length, feats.length);
  return feats;
}

// 手動觸發 bbox 重新載入
async function reloadByBounds() {
  const btn = document.getElementById('bbox-reload-btn');
  if (btn) { btn.disabled = true; btn.textContent = '載入中…'; }
  try {
    const b = map.getBounds();
    lastLoadedBounds = b.pad(0.4);

    document.getElementById('st-pipe').textContent = '載入中…';
    document.getElementById('st-pipe').className = 'status-val loading';
    const pf = await fetchByBounds(PIPE_LAYER, b, (d,t) => {
      document.getElementById('st-pipe').textContent = `${d} 筆`;
    });
    allPipeData = pf;
    renderPipes(pf);
    document.getElementById('st-pipe').textContent = pf.length.toLocaleString() + ' 條';
    document.getElementById('st-pipe').className = 'status-val done';

    document.getElementById('st-manhole').textContent = '載入中…';
    document.getElementById('st-manhole').className = 'status-val loading';
    const mf = await fetchByBounds(MANHOLE_LAYER, b, (d,t) => {
      document.getElementById('st-manhole').textContent = `${d} 筆`;
    });
    allManholeData = mf;
    renderManholes(mf);
    document.getElementById('st-manhole').textContent = mf.length.toLocaleString() + ' 座';
    document.getElementById('st-manhole').className = 'status-val done';

    const total = pf.length + mf.length;
    document.getElementById('st-total').textContent = total.toLocaleString() + ' 筆';
    document.getElementById('st-total').className = 'status-val done';
  } catch(e) {
    console.error(e);
  }
  if (btn) { btn.disabled = false; btn.textContent = '📡 更新此範圍'; }
}

// 地圖移動後自動重載（bbox 模式）
map.on('moveend', () => {
  if (!isBboxMode) return;
  const cur = map.getBounds();
  if (lastLoadedBounds && lastLoadedBounds.contains(cur)) return; // 還在範圍內
  clearTimeout(bboxTimer);
  bboxTimer = setTimeout(reloadByBounds, 900);
});

function pipeStyle() {
  return {
    color: '#3b82f6',
    weight: pipeWidth,
    opacity: 0.85,
    lineCap: 'round',
    lineJoin: 'round',
  };
}

function renderPipes(features) {
  if (pipeLayer) { map.removeLayer(pipeLayer); }
  // 過濾掉 geometry 為 null 或座標含 null 的 feature
  const valid = features.filter(f => {
    if(!f.geometry||!f.geometry.coordinates)return false;
    const c=f.geometry.coordinates;
    if(!Array.isArray(c)||c.length<2)return false;
    const first = Array.isArray(c[0]) && Array.isArray(c[0][0]) ? c[0][0] : c[0];
    return Array.isArray(first) && first[0]!=null && first[1]!=null && !isNaN(first[0]) && !isNaN(first[1]);
  });
  console.log(`[GIS] 有效管線 ${valid.length}/${features.length}`);
  pipeLayer = L.geoJSON(valid, {
    renderer: canvasRenderer,
    style: pipeStyle(),
    onEachFeature: (feature, layer) => {
      layer.on('click', () => showPipePopup(feature, layer));
      layer.on('mouseover', () => layer.setStyle({ color: '#22d3ee', weight: pipeWidth + 1.5, opacity: 1 }));
      layer.on('mouseout',  () => layer.setStyle(pipeStyle()));
    }
  }).addTo(map);
  document.getElementById('cnt-pipe').textContent = valid.length.toLocaleString() + ' 條';
}

function showPipePopup(feature, layer) {
  const p = feature.properties || {};
  // 嘗試常見欄位名稱
  const fields = [
    ['管段編號', p.PIPEID || p.pipe_id || p.ID || p.ObjectID || p.OBJECTID || '—'],
    ['管徑 (mm)', p.DIAM || p.DIAMETER || p.diameter || p.pipe_diam || '—'],
    ['管材',      p.MATERIAL || p.MATL || p.material || '—'],
    ['管長 (m)',  p.LENGTH || p.length || p.SHAPE_Length?.toFixed(2) || '—'],
    ['埋設年份',  p.INSTALL_YEAR || p.year || p.YEAR || '—'],
    ['行政區',    p.DISTRICT || p.district || p.TOWN || '—'],
    ['地址',      p.ADDRESS || p.address || p.ADDR || '—'],
  ].filter(([k,v]) => v && v !== '—' && v !== 'Null' && v !== 'null');

  const rows = fields.map(([k,v]) =>
    `<div class="pop-row"><span class="pop-key">${k}</span><span class="pop-val">${v}</span></div>`
  ).join('');

  const popup = `<div class="pop-wrap">
    <div class="pop-title pipe">🔵 雨水管線</div>
    ${rows || '<div style="color:#94a3b8;font-size:11px">（無屬性資料）</div>'}
    ${p.SHAPE_Length ? `<span class="pop-badge" style="background:#dbeafe;color:#1d4ed8">長度 ${p.SHAPE_Length.toFixed(1)} m</span>` : ''}
  </div>`;

  layer.bindPopup(popup, { maxWidth: 300 }).openPopup();
  if (zoomOnClick) map.panTo(layer.getBounds().getCenter());
}

// ===================================================================
// 人孔渲染
// ===================================================================
function getManholeId(p) {
  return p.MANHOLEID || p.manhole_id || p.MH_NO || p.MH_ID || p.ID || p.OBJECTID || '';
}

function renderManholes(features) {
  // 清除舊圖層
  manholeMarkers.forEach(m => map.removeLayer(m));
  labelMarkers.forEach(m => map.removeLayer(m));
  manholeMarkers = [];
  labelMarkers = [];

  features.forEach(feature => {
    if (!feature.geometry) return;
    const coords = feature.geometry.coordinates;
    if (!Array.isArray(coords) || coords[0]==null || coords[1]==null || isNaN(coords[0]) || isNaN(coords[1])) return;
    const [lng, lat] = coords;
    const p = feature.properties || {};
    const mhId = getManholeId(p);

    // 圓點 marker — 使用 Canvas renderer 效能較好
    const marker = L.circleMarker([lat, lng], {
      renderer: canvasRenderer,
      radius: 4,
      fillColor: '#10b981',
      color: '#059669',
      weight: 1,
      fillOpacity: 0.85,
      opacity: 1,
    }).addTo(map);

    marker.on('click', () => showManholePopup(feature, marker));
    marker.on('mouseover', () => marker.setStyle({ radius: 8, fillColor: '#34d399', weight: 2.5 }));
    marker.on('mouseout',  () => marker.setStyle({ radius: 5, fillColor: '#10b981', weight: 1.5 }));

    manholeMarkers.push(marker);

    // 標籤
    if (mhId) {
      const label = L.marker([lat, lng], {
        icon: L.divIcon({
          html: `<div class="manhole-label">${mhId}</div>`,
          className: '',
          iconAnchor: [0, -6],
        }),
        interactive: false,
        zIndexOffset: 100,
      });
      labelMarkers.push(label);
      if (showManholeLabels) label.addTo(map);
    }
  });

  document.getElementById('cnt-manhole').textContent = features.length.toLocaleString() + ' 座';
}

function showManholePopup(feature, marker) {
  const p = feature.properties || {};
  const mhId = getManholeId(p);
  const fields = [
    ['人孔編號', mhId || '—'],
    ['蓋型',     p.COVER_TYPE || p.cover_type || p.TYPE || '—'],
    ['深度 (m)', p.DEPTH || p.depth || '—'],
    ['管底高程', p.INVERT_EL || p.invert_el || '—'],
    ['蓋頂高程', p.RIM_EL || p.rim_el || '—'],
    ['行政區',   p.DISTRICT || p.district || p.TOWN || '—'],
    ['地址',     p.ADDRESS || p.address || p.ADDR || '—'],
  ].filter(([k,v]) => v && v !== '—' && v !== 'Null' && v !== 'null');

  const rows = fields.map(([k,v]) =>
    `<div class="pop-row"><span class="pop-key">${k}</span><span class="pop-val">${v}</span></div>`
  ).join('');

  const popup = `<div class="pop-wrap">
    <div class="pop-title manhole">🟢 雨水人孔</div>
    ${rows || '<div style="color:#94a3b8;font-size:11px">（無屬性資料）</div>'}
  </div>`;

  marker.bindPopup(popup, { maxWidth: 300 }).openPopup();
  if (zoomOnClick) map.panTo(marker.getLatLng());
}

// ===================================================================
// 圖層開關
// ===================================================================
const layerVisible = { pipe: true, manhole: true, 'divert-pipe': true, 'divert-mh': true };

function toggleLayer(name) {
  layerVisible[name] = !layerVisible[name];
  const on = layerVisible[name];
  document.getElementById('chk-' + name).textContent = on ? '✓' : '';
  document.getElementById('chk-' + name).classList.toggle('on', on);
  document.getElementById('layer-' + name).classList.toggle('active', on);

  if (name === 'pipe') {
    if (pipeLayer) { on ? map.addLayer(pipeLayer) : map.removeLayer(pipeLayer); }
  }
  if (name === 'manhole') {
    manholeMarkers.forEach(m => on ? m.addTo(map) : map.removeLayer(m));
    if (showManholeLabels) labelMarkers.forEach(m => on ? m.addTo(map) : map.removeLayer(m));
  }
  if (name === 'divert-pipe') {
    if (divertPipeLayer) { on ? map.addLayer(divertPipeLayer) : map.removeLayer(divertPipeLayer); }
  }
  if (name === 'divert-mh') {
    divertMhMarkers.forEach(m => on ? m.addTo(map) : map.removeLayer(m));
    if (showManholeLabels) divertLabelMarkers.forEach(m => on ? m.addTo(map) : map.removeLayer(m));
  }
}

// ===================================================================
// 顯示選項
// ===================================================================
function toggleManholeLabels() {
  showManholeLabels = !showManholeLabels;
  document.getElementById('tog-label').classList.toggle('on', showManholeLabels);
  labelMarkers.forEach(m => {
    if (showManholeLabels && layerVisible.manhole) m.addTo(map);
    else map.removeLayer(m);
  });
}

function toggleZoomOnClick() {
  zoomOnClick = !zoomOnClick;
  document.getElementById('tog-zoom').classList.toggle('on', zoomOnClick);
}

function updatePipeWidth() {
  pipeWidth = parseFloat(document.getElementById('pipe-width').value);
  if (pipeLayer) pipeLayer.setStyle(pipeStyle());
}

// ===================================================================
// 側欄折疊
// ===================================================================
function toggleSide() {
  sideOpen = !sideOpen;
  document.getElementById('side').classList.toggle('collapsed', !sideOpen);
  const btn = document.getElementById('toggle-panel');
  btn.textContent = sideOpen ? '◀' : '▶';
  btn.style.left = sideOpen ? '280px' : '0';
  setTimeout(() => map.invalidateSize(), 280);
}

// ===================================================================
// 搜尋人孔
// ===================================================================
document.getElementById('search-input').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  const clr = document.getElementById('search-clear');
  clr.style.display = q ? 'block' : 'none';

  if (!q) { document.getElementById('search-result').textContent = ''; return; }

  const matched = allManholeData.filter(f => {
    const p = f.properties || {};
    const id = getManholeId(p).toLowerCase();
    const addr = (p.ADDRESS || p.address || p.ADDR || '').toLowerCase();
    return id.includes(q) || addr.includes(q);
  });

  const resultEl = document.getElementById('search-result');
  if (matched.length === 0) {
    resultEl.textContent = '找不到符合的人孔';
    return;
  }
  resultEl.innerHTML = `找到 <strong style="color:var(--gn)">${matched.length}</strong> 筆，點擊定位：`;

  // 定位到第一筆
  if (matched[0].geometry) {
    const [lng, lat] = matched[0].geometry.coordinates;
    map.setView([lat, lng], 17);
    // 找對應 marker 開啟 popup
    const idx = allManholeData.indexOf(matched[0]);
    if (manholeMarkers[idx]) {
      setTimeout(() => manholeMarkers[idx].fire('click'), 300);
    }
  }
});

document.getElementById('search-clear').addEventListener('click', () => {
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').style.display = 'none';
  document.getElementById('search-result').textContent = '';
});

// ===================================================================
// 主載入流程
// ===================================================================
async function init() {
  const loader = document.getElementById('loader');
  const prog   = document.getElementById('loader-prog');

  try {
    // ── 先查總筆數，決定載入策略 ──
    prog.textContent = '確認圖資規模…';
    const countData = await tryFetch(gisUrl(`/${PIPE_LAYER}/query?where=1%3D1&returnCountOnly=true&f=json`), 12000);
    const totalPipeCount = countData?.count ?? 0;
    console.log(`[GIS] 管線總筆數: ${totalPipeCount}`);

    if (totalPipeCount > 3000) {
      // ── BBOX 模式：只載入目前視窗範圍 ──
      isBboxMode = true;
      prog.textContent = '資料量大，改用範圍載入…';
      // 加入「更新此範圍」按鈕到狀態列
      const stTotal = document.getElementById('st-total');
      stTotal.insertAdjacentHTML('afterend',
        '<button id="bbox-reload-btn" onclick="reloadByBounds()" style="margin-top:6px;width:100%;padding:5px;background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.3);color:var(--cy);border-radius:5px;cursor:pointer;font-size:.72rem;font-family:var(--f)">📡 更新此範圍</button>'
      );
      await reloadByBounds();
    } else {
      // ── 全量模式：一次載入所有資料 ──
      prog.textContent = '載入管線資料…';
      document.getElementById('st-pipe').textContent = '載入中…';
      const pipeFeatures = await fetchAllFeatures(PIPE_LAYER, (done, total) => {
        prog.textContent = `管線：${done} / ${total}`;
        document.getElementById('st-pipe').textContent = `${done}/${total}`;
      });
      allPipeData = pipeFeatures;
      renderPipes(pipeFeatures);
      document.getElementById('st-pipe').textContent = pipeFeatures.length.toLocaleString() + ' 條';
      document.getElementById('st-pipe').className = 'status-val done';

      prog.textContent = '載入人孔資料…';
      document.getElementById('st-manhole').textContent = '載入中…';
      const manholeFeatures = await fetchAllFeatures(MANHOLE_LAYER, (done, total) => {
        prog.textContent = `人孔：${done} / ${total}`;
        document.getElementById('st-manhole').textContent = `${done}/${total}`;
      });
      allManholeData = manholeFeatures;
      renderManholes(manholeFeatures);
      document.getElementById('st-manhole').textContent = manholeFeatures.length.toLocaleString() + ' 座';
      document.getElementById('st-manhole').className = 'status-val done';

      const total = pipeFeatures.length + manholeFeatures.length;
      document.getElementById('st-total').textContent = total.toLocaleString() + ' 筆';
      document.getElementById('st-total').className = 'status-val done';

      if (pipeLayer && Object.keys(pipeLayer._layers).length > 0) {
        try { map.fitBounds(pipeLayer.getBounds(), { padding: [30, 30] }); } catch(e) {}
      }
    }

  } catch(err) {
    console.error(err);
    document.getElementById('st-pipe').textContent = '載入失敗';
    document.getElementById('st-pipe').className = 'status-val err';
    document.getElementById('st-manhole').textContent = '載入失敗';
    document.getElementById('st-manhole').className = 'status-val err';
    prog.textContent = '❌ ' + err.message;
  }

  loader.classList.add('hide');
  setTimeout(() => loader.style.display = 'none', 600);
}

// 地圖縮放時控制標籤顯示（zoom < 14 隱藏標籤，避免擁擠）
map.on('zoomend', () => {
  const z = map.getZoom();
  labelMarkers.forEach(m => {
    if (z >= 14 && showManholeLabels && layerVisible.manhole) m.addTo(map);
    else map.removeLayer(m);
  });
  divertLabelMarkers.forEach(m => {
    if (z >= 14 && showManholeLabels && layerVisible['divert-mh']) m.addTo(map);
    else map.removeLayer(m);
  });
});


// ===================================================================
// 截流系統渲染
// ===================================================================
function renderDivertPipes() {
  if (divertPipeLayer) map.removeLayer(divertPipeLayer);
  const geojson = {
    type: 'FeatureCollection',
    features: DIVERT_PIPE_DATA.map(p => ({
      type: 'Feature',
      geometry: { type: 'LineString', coordinates: p.coords },
      properties: p
    }))
  };
  divertPipeLayer = L.geoJSON(geojson, {
    style: () => ({ color: '#f97316', weight: 2, opacity: 0.9 }),
    onEachFeature: (feature, layer) => {
      const p = feature.properties;
      layer.on('click', () => {
        const popup = `<div class="pop-wrap">
          <div class="pop-title" style="color:#f97316">🟠 截流管線</div>
          <table class="pop-table">
            <tr><td>管線編號</td><td>${p.sewer_no||'—'}</td></tr>
            <tr><td>上游人孔</td><td>${p.umh_no||'—'}</td></tr>
            <tr><td>下游人孔</td><td>${p.dmh_no||'—'}</td></tr>
            <tr><td>管徑</td><td>${p.dia||'—'} mm</td></tr>
            <tr><td>長度</td><td>${p.length||'—'} m</td></tr>
            <tr><td>坡度</td><td>${p.slope||'—'} ‰</td></tr>
            <tr><td>上游管底</td><td>${p.uie||'—'} m</td></tr>
            <tr><td>下游管底</td><td>${p.die||'—'} m</td></tr>
          </table></div>`;
        layer.bindPopup(popup, { maxWidth: 280 }).openPopup();
        if (zoomOnClick) map.panTo(layer.getBounds().getCenter());
      });
      layer.on('mouseover', () => layer.setStyle({ color: '#fdba74', weight: 3.5, opacity: 1 }));
      layer.on('mouseout',  () => layer.setStyle({ color: '#f97316', weight: 2, opacity: 0.9 }));
    }
  }).addTo(map);
}

function renderDivertManholes() {
  divertMhMarkers.forEach(m => map.removeLayer(m));
  divertLabelMarkers.forEach(m => map.removeLayer(m));
  divertMhMarkers = []; divertLabelMarkers = [];
  const z = map.getZoom();
  DIVERT_MH_DATA.forEach(mh => {
    const lat = mh.lat, lng = mh.lng;
    if (!lat || !lng) return;
    const marker = L.circleMarker([lat, lng], {
      radius: 5, fillColor: '#fb923c', color: '#ea580c',
      weight: 1.5, fillOpacity: 0.95, opacity: 1
    }).addTo(map);
    const popup = `<div class="pop-wrap">
      <div class="pop-title" style="color:#fb923c">🟠 截流人孔</div>
      <table class="pop-table">
        <tr><td>人孔編號</td><td><b>${mh.mh_no||'—'}</b></td></tr>
        <tr><td>地面高程</td><td>${mh.g_level} m</td></tr>
        <tr><td>人孔深度</td><td>${mh.mh_ht} m</td></tr>
        <tr><td>備註</td><td>${mh.memo||'—'}</td></tr>
      </table></div>`;
    marker.bindPopup(popup, { maxWidth: 260 });
    divertMhMarkers.push(marker);
    if (showManholeLabels && layerVisible['divert-mh']) {
      const label = L.marker([lat, lng], {
        icon: L.divIcon({ className: 'mh-label', html: mh.mh_no, iconAnchor: [-6, 6] }),
        interactive: false
      });
      if (z >= 14) label.addTo(map);
      divertLabelMarkers.push(label);
    }
  });
}


// ===================================================================
// 連續定位追蹤
// ===================================================================
function toggleLocTracking() {
  if (isTracking) {
    stopLocTracking();
  } else {
    startLocTracking();
  }
}

function startLocTracking() {
  if (!navigator.geolocation) {
    alert('您的瀏覽器不支援定位功能');
    return;
  }
  isTracking = true;
  const btn = document.getElementById('loc-btn');
  btn.classList.add('tracking');
  btn.textContent = '🔵';
  btn.title = '定位追蹤中，點擊停止';

  const opts = { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 };

  // 先 getCurrentPosition 立即定位一次
  navigator.geolocation.getCurrentPosition(pos => {
    updateUserLocation(pos);
    map.setView([pos.coords.latitude, pos.coords.longitude], Math.max(map.getZoom(), 16));
  }, locError, opts);

  // 再 watchPosition 持續追蹤
  locWatchId = navigator.geolocation.watchPosition(pos => {
    updateUserLocation(pos);
    // 持續將地圖中心跟著使用者走
    map.panTo([pos.coords.latitude, pos.coords.longitude], { animate: true, duration: 0.5 });
  }, locError, opts);
}

function stopLocTracking() {
  isTracking = false;
  if (locWatchId !== null) {
    navigator.geolocation.clearWatch(locWatchId);
    locWatchId = null;
  }
  const btn = document.getElementById('loc-btn');
  btn.classList.remove('tracking');
  btn.textContent = '📍';
  btn.title = '連續定位追蹤';
  // 移除定位標記
  if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
  if (userAccCircle) { map.removeLayer(userAccCircle); userAccCircle = null; }
}

function updateUserLocation(pos) {
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;
  const acc = pos.coords.accuracy;

  // 精度圓
  if (userAccCircle) {
    userAccCircle.setLatLng([lat, lng]).setRadius(acc);
  } else {
    userAccCircle = L.circle([lat, lng], {
      radius: acc, color: '#22d3ee', fillColor: '#22d3ee',
      fillOpacity: 0.08, weight: 1, opacity: 0.4
    }).addTo(map);
  }

  // 使用者位置標記（藍點 + 脈衝）
  if (userMarker) {
    userMarker.setLatLng([lat, lng]);
  } else {
    const icon = L.divIcon({
      className: '',
      html: `<div style="
        width:16px;height:16px;background:#22d3ee;border:2.5px solid #fff;
        border-radius:50%;box-shadow:0 0 0 4px rgba(34,211,238,.25);
        animation:locPulse 2s ease-in-out infinite;position:relative;top:-8px;left:-8px">
      </div>`,
      iconSize: [0, 0], iconAnchor: [0, 0]
    });
    userMarker = L.marker([lat, lng], { icon, zIndexOffset: 1000 }).addTo(map);
    userMarker.bindTooltip(`📍 精度 ${Math.round(acc)}m`, { permanent: false, direction: 'top' });
  }
}

function locError(err) {
  console.warn('定位錯誤:', err.message);
  const msgs = { 1: '定位權限被拒絕，請在瀏覽器設定中允許定位', 2: '無法取得位置資訊', 3: '定位逾時，請確認 GPS 是否開啟' };
  stopLocTracking();
  alert(msgs[err.code] || '定位失敗：' + err.message);
}

init();
renderDivertPipes();
renderDivertManholes();
</script>
